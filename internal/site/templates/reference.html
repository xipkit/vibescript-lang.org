{{define "reference"}}
<div class="reference">
  <aside class="reference-sidebar">
    <nav class="reference-nav" aria-label="Reference sections" data-reference-nav>
      {{range .Reference.Sections}}
      <div class="reference-nav-group">
        <a class="reference-nav-title" href="#{{.ID}}">{{.Title}}</a>
        <ul>
          {{range .Items}}
          <li><a href="#{{.ID}}">{{.Title}}</a></li>
          {{end}}
        </ul>
      </div>
      {{end}}
    </nav>
  </aside>

  <article class="reference-prose">
    <header class="reference-header">
      <span class="eyebrow"><svg class="vee" aria-hidden="true"><use href="#vee"></use></svg> Reference</span>
      <h1>Language Reference</h1>
      <p class="reference-lede">A guide to Vibescript <a href="{{.UpstreamRepoURL}}/releases/tag/{{.UpstreamVersion}}">{{.UpstreamVersion}}</a>: syntax, types, and how to run scripts in your app.</p>
    </header>
    {{.Reference.Content}}
  </article>
</div>
{{end}}
