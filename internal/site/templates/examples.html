{{define "examples"}}
<div class="catalog">
  <aside class="catalog-sidebar" data-catalog-sidebar>
    <div class="catalog-sidebar-header">
      <svg class="sparkle sparkle-sm sparkle-string sparkle-catalog" style="--tilt: 16deg" aria-hidden="true"><use href="#sparkle"></use></svg>
      <span class="eyebrow"><svg class="vee" aria-hidden="true"><use href="#vee"></use></svg> Examples</span>
      <h2>Browse examples</h2>
      <p>Hundreds of examples you can run in your browser.</p>
    </div>
    <nav class="catalog-nav" data-catalog-nav></nav>
  </aside>

  <div class="catalog-main">
    <div class="catalog-toolbar" data-catalog-toolbar>
      <div class="catalog-active-filters" data-active-filters></div>
    </div>
    <div class="card-grid" data-catalog-grid>
      {{range .Examples}}
      <a href="/examples/{{.Slug}}" class="example-card" data-accent="{{accent .Category}}" data-category="{{.Category}}" data-tags="{{range .Tags}}{{.}} {{end}}">
        <div class="card-meta">
          <span class="card-category" data-accent="{{accent .Category}}">{{.Category}}</span>
          {{if .Runnable}}<span class="card-runnable" title="Runs in your browser">runnable</span>{{end}}
        </div>
        <h3>{{.Title}}</h3>
        <p>{{.Summary}}</p>
      </a>
      {{end}}
    </div>
  </div>
</div>
{{end}}
